# --- build
[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

# --- setuptools
[tool.setuptools]
#py-modules = ["parnet"]
packages = ["parnet"]

# --- project
[project]
version = "0.5.0"

name = "parnet"
authors = [{ name = "Marc Horlacher", email = "marc.horlacher@gmail.com" }]
description = "A description of the project."

readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# Help categorize the project and make it easier for users and tools (such as PyPI and
# package managers) to discover, filter, and understand the project's purpose, audience,
# and compatibility.
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "biopython >=1.83",
    "click >=8.2",
    "datasets >=3.6.0",
    "gin_config>=0.5.0",
    "lightning >=2.3",
    "pybigwig >=0.3.22",
    "pysam >=0.23.3",
    "pandas >=2.0",
    "numpy >=1.26",
    "torch >=2.5",
    "torchmetrics >=1.0",
    "tqdm >=4.67.1",
    "captum >=0.7.0",
]


[project.optional-dependencies]

gpu = [
    "torch >=2.5",
    "torchmetrics >=1.0",
]



dev = [
    "pre-commit >=4.0,<5.0",
    # Lint
    "mypy >=1.11,<2.0",
    # One ruff for everything: .pre-commit-config.yaml runs this same
    # installed ruff via a local hook, so the hook and the terminal cannot
    # disagree. Previously the hook pinned v0.7.1 against this >=0.11.
    "ruff >=0.11,<1.0",
    # Tests
    "pytest >=8.4,<9",
    "pytest-cov >=6.0,<7.0",
]

[project.scripts]
parnet = "parnet.__main__:main"


# --- ruff
[tool.ruff]
line-length = 120
indent-width = 4
lint.pydocstyle.convention = "google"
format.quote-style = "single"
format.indent-style = "space"
