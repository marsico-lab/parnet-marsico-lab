# --- build
[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

# --- setuptools
[tool.setuptools]
#py-modules = ["parnet"]
packages = ["parnet"]

# --- project
[project]
version = "0.5.0"

name = "parnet"
authors = [{ name = "Marc Horlacher", email = "marc.horlacher@gmail.com" }]
description = "A description of the project."

readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# Help categorize the project and make it easier for users and tools (such as PyPI and
# package managers) to discover, filter, and understand the project's purpose, audience,
# and compatibility.
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "biopython >=1.83",
    "click >=8.2",
    "datasets >=3.6.0",
    "gin_config>=0.5.0",
    "lightning >=2.3",
    "pybigwig >=0.3.22",
    "pysam >=0.23.3",
    "pandas >=2.0",
    "numpy >=1.26",
    "torch >=2.5",
    "torchmetrics >=1.0",
    "tqdm >=4.67.1",
    "captum >=0.7.0",
    # The on-disk model format. parnet.pretrained imports it on every
    # save_pretrained/from_pretrained, so it is a core dependency, not an extra.
    "safetensors >=0.4",
]


[project.optional-dependencies]

gpu = [
    "torch >=2.5",
    "torchmetrics >=1.0",
]



dev = [
    "pre-commit >=4.0,<5.0",
    # Lint
    "mypy >=1.11,<2.0",
    # One ruff for everything, pinned EXACTLY. The pre-commit hook runs this same
    # installed binary via a local hook, and CI installs this same extra, so the
    # hook, the terminal and CI cannot disagree. A range is not enough: CI once
    # resolved 0.17.3 against a local 0.15.14 and the newer default rule set failed
    # 61 checks the older one passed. Bump deliberately, not by resolution.
    "ruff ==0.17.3",
    # Tests
    "pytest >=8.4,<9",
    "pytest-cov >=6.0,<7.0",
]

[project.scripts]
parnet = "parnet.__main__:main"


# --- ruff
[tool.ruff]
line-length = 120
indent-width = 4
format.quote-style = "single"
format.indent-style = "space"

[tool.ruff.lint]
# Selected explicitly rather than relying on ruff's defaults, which grow between
# releases: a version bump would otherwise introduce new failures in CI without any
# change to this repository.
#   E4/E7/E9, F  ruff's own default set (pycodestyle subset + pyflakes)
#   I            import sorting, fully auto-fixable
select = ["E4", "E7", "E9", "F", "I"]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
# importorskip must run before the import it guards, so the import cannot be at the top.
"tests/test_losses.py" = ["E402"]
# Known-dead module, kept only so the Hugging Face training path is not lost silently.
# It cannot import (its `tomix` dependency is not installable from any index) and it
# references five names that are never defined or imported (mlflow, default_collate_fn,
# count_trainable_params). Suppressed rather than fixed because fixing code that has
# never run would be inventing behaviour. Delete or rewrite before 1.0.
"parnet/bin/train_hf.py" = ["F821", "E402"]
# Exploratory notebooks kept for provenance; not held to library style.
"notebooks/*.ipynb" = ["E741", "F821", "E402"]
