name: CI

on:
  push:
    branches: [org-main, dev, refactor]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # CPU wheels: CI has no GPU and the CUDA builds are ~2.5 GB.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5"
          pip install -e ".[dev]"

      - name: Lint
        # Same ruff the pre-commit hook uses, because both come from the dev extra.
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest tests -q
